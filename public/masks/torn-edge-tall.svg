<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" preserveAspectRatio="none">
  <!-- Torn-paper mask (portrait, phones). Same recipe as torn-edge-wide.svg, tuned for a tall box. -->
  <filter id="torn" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.006" numOctaves="3" seed="11" result="tear" />
    <feDisplacementMap in="SourceGraphic" in2="tear" scale="22" xChannelSelector="R" yChannelSelector="G" result="torn" />
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="3" seed="4" result="fibre" />
    <feDisplacementMap in="torn" in2="fibre" scale="9" xChannelSelector="G" yChannelSelector="R" result="frayed" />
    <feGaussianBlur in="frayed" stdDeviation="1.5" result="edge" />
    <feGaussianBlur in="frayed" stdDeviation="5" result="blurred" />
    <feComponentTransfer in="blurred" result="haze">
      <feFuncA type="linear" slope="0.55" />
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="haze" />
      <feMergeNode in="edge" />
    </feMerge>
  </filter>
  <rect x="14" y="18" width="772" height="1364" rx="12" fill="#fff" filter="url(#torn)" />
</svg>
