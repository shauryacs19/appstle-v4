<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="none">
  <!--
    Torn-paper mask (landscape). A rounded rect is ripped by two displacement passes — a slow,
    uneven tear and a fine fibre fray — then merged with a thin haze so the edge fades out softly. The rip hugs the box edges, so the video fills almost all of it.
    White = visible. Used by .mask-torn (src/styles/globals.css).
  -->
  <filter id="torn" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0055 0.008" numOctaves="3" seed="11" result="tear" />
    <feDisplacementMap in="SourceGraphic" in2="tear" scale="36" xChannelSelector="R" yChannelSelector="G" result="torn" />
    <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="4" result="fibre" />
    <feDisplacementMap in="torn" in2="fibre" scale="12" xChannelSelector="G" yChannelSelector="R" result="frayed" />
    <feGaussianBlur in="frayed" stdDeviation="1.8" result="edge" />
    <feGaussianBlur in="frayed" stdDeviation="7" result="blurred" />
    <feComponentTransfer in="blurred" result="haze">
      <feFuncA type="linear" slope="0.55" />
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="haze" />
      <feMergeNode in="edge" />
    </feMerge>
  </filter>
  <rect x="22" y="24" width="1556" height="952" rx="16" fill="#fff" filter="url(#torn)" />
</svg>
